  <g id="names" style="font-family:'Noto Sans CJK JP', 'Noto Sans JP', 'MS Gothic', sans-serif;font-size:16px">
    <text x="312.0" y="6.5" writing-mode="tb" style="fill:#0000ff">高御産巣日神</text>
    <text x="246.0" y="7.5" writing-mode="tb" style="fill:#0000ff">伊邪那岐神</text>
    <text x="65.0" y="8.5" writing-mode="tb" style="fill:#ff0000">伊邪那美神</text>
    <text x="97.0" y="64.5" writing-mode="tb" style="fill:#0000ff">大山津見神</text>
    <text x="263.0" y="119.5" writing-mode="tb" style="fill:#ff0000">天照大御神</text>
    <text x="80.0" y="192.5" writing-mode="tb" style="fill:#ff0000">手名椎神</text>
    <text x="113.0" y="193.5" writing-mode="tb" style="fill:#0000ff">足名椎神</text>
    <text x="312.0" y="215.5" writing-mode="tb" style="fill:#ff0000">万幡豊秋津師比売命</text>
    <text writing-mode="tb" style="fill:#0000ff"><tspan x="270.0" y="237.5">正勝吾勝勝速日</tspan><tspan x="253.0" y="237.5">天之忍穂耳命</tspan></text>
    <text x="158.0" y="265.5" writing-mode="tb" style="fill:#0000ff">須佐之男命</text>
    <text x="98.0" y="266.5" writing-mode="tb" style="fill:#ff0000">櫛名田比売</text>
    <text writing-mode="tb" style="fill:#0000ff"><tspan x="299.0" y="361.5">天邇岐志国邇岐志天津</tspan><tspan x="282.0" y="361.5">日高日子番能邇邇芸命</tspan></text>
    <text x="213.0" y="364.5" writing-mode="tb" style="fill:#ff0000">木花之佐久夜毘売</text>
    <text x="177.0" y="412.5" writing-mode="tb" style="fill:#0000ff">綿津見大神</text>
    <text x="22.0" y="462.5" writing-mode="tb" style="fill:#ff0000">勢夜陀多良比売</text>
    <text x="83.0" y="468.5" writing-mode="tb" style="fill:#0000ff">大物主神</text>
    <text x="131.0" y="468.5" writing-mode="tb" style="fill:#0000ff">大国主神</text>
    <text x="254.0" y="554.5" writing-mode="tb" style="fill:#0000ff">火遠理命</text>
    <text x="212.0" y="555.5" writing-mode="tb" style="fill:#ff0000">豊玉毘売命</text>
    <text writing-mode="tb" style="fill:#0000ff"><tspan x="240.0" y="650.5">天津日高日子波限建</tspan><tspan x="223.0" y="650.5">鵜葺草葺不合命</tspan></text>
    <text x="166.0" y="658.5" writing-mode="tb" style="fill:#ff0000">玉依毘売命</text>
    <text writing-mode="tb" style="fill:#ff0000"><tspan x="62.0" y="728.5">比売多多良</tspan><tspan x="45.0" y="728.5">伊須気余理比売</tspan></text>
    <text x="195.0" y="762.5" writing-mode="tb" style="fill:#0000ff">神武天皇</text>
  </g>
  <g id="notes" style="font-family:'Noto Sans CJK JP', 'Noto Sans JP', 'MS Gothic', sans-serif">
