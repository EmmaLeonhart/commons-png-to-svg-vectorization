    <text x="166.0" y="844.0" text-anchor="middle" style="font-size:12px;fill:#000000">天津神系</text>
    <text x="109.0" y="508.5" writing-mode="tb" style="font-size:12px;fill:#000000">幸魂・奇魂</text>
    <text x="206.0" y="763.0" text-anchor="middle" style="font-size:12px;fill:#000000">1</text>
  </g>
